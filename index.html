<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#06294d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Settlers of Friends</title>
<link rel="stylesheet" href="/style.css">
<style>
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--text); color: var(--ink2); background: radial-gradient(ellipse at 50% 22%, var(--sea1), var(--sea2) 45%, var(--sea3) 85%) fixed; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
button { font-family: inherit; }
.view { position: relative; display: none; min-height: var(--vh, 100vh); box-sizing: border-box; }
.view.on { display: block; }
.wrap { max-width: 480px; margin: 0 auto; padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); box-sizing: border-box; }

/* ---- join */
#join .wrap { padding-top: 40px; text-align: center; }
#join .logo { justify-content: center; flex-direction: column; gap: 14px; margin-bottom: 22px; }
#join .logo .mk { width: 104px; height: 104px; }
#join .logo b { font-size: 38px; }
#join .logo small { font-size: 11px; margin-top: 10px; }
.j-card { padding: 22px 18px 18px; text-align: left; }
.j-card label { display: flex; justify-content: space-between; font: 800 11px/1 var(--text); letter-spacing: .28em; color: var(--ink-p2); margin: 4px 0 9px; }
.j-card label .left { letter-spacing: .05em; font-weight: 600; }
.j-card input { width: 100%; box-sizing: border-box; font: 800 24px/1.2 var(--text); padding: 13px 16px; border: 0; border-radius: var(--r3); background: #fff; color: var(--ink-p); box-shadow: inset 0 0 0 2px var(--parch3); margin-bottom: 16px; outline: none; }
.j-card input:focus { box-shadow: inset 0 0 0 2px var(--wood); }
#code { font: 400 44px/1 var(--display); letter-spacing: .4em; text-align: center; text-transform: uppercase; padding: 12px 0 12px .4em; }
.j-play { width: 100%; font-size: 24px; padding: 17px; letter-spacing: .08em; }
.j-play.ready { animation: pulse 1.4s infinite; }
.j-or { display: flex; align-items: center; gap: 12px; margin: 16px 0 12px; font: 800 11px/1 var(--text); letter-spacing: .28em; color: var(--ink-p2); }
.j-or::before, .j-or::after { content: ''; flex: 1; height: 2px; background: var(--parch3); }
.j-host { width: 100%; font-size: 17px; padding: 14px; }
.j-note { font: 400 13px/1.4 var(--text); color: var(--ink-p2); margin: 10px 2px 0; text-align: center; }
#joinErr { color: #b3202c; font-weight: 800; min-height: 20px; margin: 12px 0 0; text-align: center; }
#joinWait { color: var(--ink-p2); font-size: 14px; margin: 6px 0 0; text-align: center; }
#saves { margin-top: 16px; text-align: left; }
.save { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 8px; border-radius: var(--r2); background: var(--slab); box-shadow: inset 0 0 0 1.5px var(--edge); }
.save .tx { flex: 1; min-width: 0; font: 600 14px/1.3 var(--text); }
.save .tx small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.ver { font: 800 11px/1 var(--text); letter-spacing: .3em; color: var(--muted2); margin-top: 26px; }
#deskTv { margin-top: 14px; font-size: 14px; color: var(--ink3); }
#deskTv a { color: var(--gold); }

/* ---- lobby */
.bar2 { display: flex; align-items: center; justify-content: space-between; font: 800 12px/1 var(--text); letter-spacing: .2em; color: var(--muted); margin: 4px 4px 12px; }
.bar2 b { color: var(--gold); }
.card { padding: 16px 16px 16px; margin-bottom: 12px; }
.card h3 { display: flex; justify-content: space-between; align-items: baseline; font: 800 12px/1 var(--text); letter-spacing: .26em; color: var(--gold); margin: 0 0 12px; }
.card.paper h3 { color: var(--ink-p2); }
.card h3 small { font: 600 12px/1 var(--text); letter-spacing: 0; color: var(--muted); }
.card.paper h3 small { color: var(--ink-p2); }
.note { font: 400 14px/1.45 var(--text); color: var(--muted); margin: 10px 0 0; }
.paper .note { color: var(--ink-p2); }
.invite { text-align: center; padding: 18px 16px 16px; }
.invite .lbl { font: 800 11px/1 var(--text); letter-spacing: .3em; color: var(--ink-p2); }
.invite .codebig { font: 400 62px/1 var(--display); letter-spacing: .18em; margin: 8px 0 4px .18em; color: var(--ink-p); }
.invite .url { font: 600 13px/1.3 var(--text); color: var(--ink-p2); margin-bottom: 12px; }
.invite .row { display: flex; gap: 8px; }
.invite .row .btn { flex: 1; font-size: 15px; padding: 12px 6px; }
.invite img { width: 180px; height: 180px; border-radius: 12px; background: #fff; padding: 8px; margin: 12px auto 0; display: block; box-shadow: inset 0 0 0 2px var(--parch3); }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 14px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; background: radial-gradient(circle at 35% 30%, var(--c1), var(--c2) 85%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); cursor: pointer; position: relative; }
.sw.on { box-shadow: 0 0 0 3px var(--panel), 0 0 0 6px var(--gold); }
.sw.taken { opacity: .22; }
.sw.taken::after { content: '✕'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; }
.faces { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.face-btn { aspect-ratio: 1; border: 0; background: var(--pit); box-shadow: inset 0 0 0 1.5px var(--edge); border-radius: 12px; font-size: 22px; padding: 0; cursor: pointer; color: var(--ink3); }
.face-btn.on { box-shadow: inset 0 0 0 3px var(--gold); background: var(--panel2); }
.face-btn.more { font: 800 20px/1 var(--text); }
.photoRow { display: flex; gap: 10px; margin-top: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--pit); }
.photoRow.on { box-shadow: inset 0 0 0 2px var(--gold); }
.photoRow .med { font-size: 20px; }
.photoRow .tx { flex: 1; font-size: 13.5px; color: var(--ink3); line-height: 1.35; }
.plist { display: flex; flex-direction: column; gap: 6px; }
.plist .pl { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; background: var(--pit); border-radius: 999px; font: 400 17px/1 var(--display); letter-spacing: .03em; }
.plist .pl .med { font-size: 14px; }
.plist .pl b { flex: 1; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .pl.off { opacity: .5; }
.plist .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 4px 8px; cursor: pointer; }
.opt { margin-bottom: 14px; }
.opt:last-child { margin-bottom: 0; }
.opt label { display: block; font: 800 11px/1 var(--text); letter-spacing: .22em; color: var(--ink3); margin-bottom: 8px; }
.opt .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.opt small { display: block; font: 400 12.5px/1.4 var(--text); color: var(--muted); margin-top: 7px; }
.startBtn { width: 100%; font-size: 21px; padding: 18px; letter-spacing: .06em; }

/* ---- play: the head-up strip */
#play { padding-bottom: calc(var(--dock, 0px) + 24px + env(safe-area-inset-bottom)); }
#hud { position: sticky; top: 0; z-index: 12; padding: 8px 10px 6px; background: linear-gradient(var(--deep) 60%, rgba(4, 26, 51, 0)); }
#hud .in { max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
#hud .med { font-size: 15px; }
#hud .who { min-width: 0; flex: 1; }
#hud .who b { display: block; font: 400 15px/1 var(--display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud .who small { display: block; font: 800 11px/1 var(--text); letter-spacing: .08em; color: var(--gold); margin-top: 4px; white-space: nowrap; }
#hud .turn { font: 800 11px/1 var(--text); letter-spacing: .1em; padding: 8px 10px; border-radius: 999px; background: var(--pit); color: var(--ink3); box-shadow: inset 0 0 0 1.5px var(--edge); white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
#hud .turn.me { background: var(--gold-bg); color: var(--gold-ink); box-shadow: none; animation: pulse 1.4s infinite; }
#hud .dice { display: flex; gap: 4px; font-size: 13px; min-width: 62px; justify-content: center; }
#hud .dice .sum { font: 400 22px/28px var(--display); color: var(--ink); min-width: 24px; text-align: center; }
#hud .clk { font: 800 12px/1 var(--text); color: var(--ink3); min-width: 34px; text-align: right; }
#hud .clk.low { color: #ff8a8a; }
#hud .menu { border: 0; background: var(--pit); color: var(--ink3); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; box-shadow: inset 0 0 0 1.5px var(--edge); flex: none; }

/* ---- play: the island */
#boardWrap { position: relative; max-width: 480px; margin: 0 auto; overflow: hidden; touch-action: pan-y; }
#boardWrap.zoomed { touch-action: none; }
#board { transform-origin: 0 0; will-change: transform; }
#board svg { max-height: calc(var(--vh, 100vh) - 322px); min-height: 240px; }
#zoomBtn { position: absolute; right: 8px; top: 4px; z-index: 3; border: 0; width: 38px; height: 38px; border-radius: 12px; background: rgba(4, 26, 51, .7); color: #fff; font: 800 18px/1 var(--text); box-shadow: inset 0 0 0 1.5px var(--edge2); }
#helpBtn { position: absolute; left: 8px; top: 4px; z-index: 3; border: 0; width: 38px; height: 38px; border-radius: 12px; background: rgba(4, 26, 51, .7); color: #fff; font: 800 18px/1 var(--text); box-shadow: inset 0 0 0 1.5px var(--edge2); }
#floaters { position: absolute; inset: 0; pointer-events: none; }

/* ---- play: the prompt, the hand, the four buttons. All fixed heights, so nothing below ever moves. */
#prompt { max-width: 480px; margin: 0 auto; height: 64px; box-sizing: border-box; padding: 4px 12px; display: flex; align-items: center; gap: 8px; }
#prompt .tx { flex: 1; min-width: 0; font: 600 14.5px/1.28 var(--text); color: var(--ink2); max-height: 56px; overflow: hidden; }
#prompt .tx b { color: var(--gold); font-weight: 800; }
#prompt .tx small { display: block; font: 400 12.5px/1.25 var(--text); color: var(--ink3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#prompt .btn { flex: none; font-size: 15px; padding: 14px 13px; }
#prompt .bchips { display: flex; gap: 6px; flex: none; }
#prompt .bchip { border: 0; background: var(--paper); border-radius: 12px; padding: 4px 7px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink-p); font: 800 9.5px/1 var(--text); letter-spacing: .04em; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15), 0 3px 8px rgba(0, 0, 0, .3); min-width: 50px; }
#prompt .bchip .pi { width: 34px; height: 34px; }
#prompt .bchip .dv { font-size: 24px; line-height: 34px; height: 34px; }
#hand { max-width: 480px; margin: 0 auto; box-sizing: border-box; height: 74px; padding: 9px 16px 0; display: flex; justify-content: space-between; align-items: flex-start; position: relative; }
#hand .rc { font-size: 17.5px; }
#hand .devs { position: relative; width: 44px; height: 56px; border-radius: 9px; border: 0; background: linear-gradient(160deg, #7a4fd0, #432489); color: #fff; font-size: 22px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35), 0 2px 5px rgba(0, 0, 0, .4); }
#hand .devs b { position: absolute; right: -7px; top: -7px; min-width: 22px; height: 22px; border-radius: 11px; background: var(--parch); color: var(--ink-p); font: 800 13px/22px var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .4), inset 0 0 0 1.5px var(--wood); }
#hand .devs.zero { filter: saturate(.3) brightness(.7); }
#acts { max-width: 480px; margin: 0 auto; box-sizing: border-box; height: 66px; padding: 4px 12px 8px; display: grid; grid-template-columns: 1fr 1fr 1fr 1.25fr; gap: 7px; }
#acts .btn { padding: 0 4px; font-size: 15.5px; height: 54px; display: flex; align-items: center; justify-content: center; line-height: 1.05; }
#acts .btn.go { animation: pulse 1.2s infinite; font-size: 19px; }
#acts .btn .n { margin-left: 5px; background: rgba(0, 0, 0, .25); border-radius: 999px; padding: 2px 7px; font: 800 12px/1.3 var(--text); }

/* ---- play: under the fold */
#below { max-width: 480px; margin: 0 auto; padding: 4px 12px 0; box-sizing: border-box; }
.tabs { display: flex; gap: 6px; margin: 0 0 10px; }
.tabs button { position: relative; flex: 1; font: 800 11.5px/1 var(--text); letter-spacing: .16em; padding: 12px 0; border: 0; border-radius: 999px; background: var(--pit); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--edge); }
.tabs button.on { background: var(--parch); color: var(--ink-p); box-shadow: none; }
.tabs .n { position: absolute; right: 8px; top: 7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #ff4f5e; color: #fff; font: 700 10px/16px var(--text); letter-spacing: 0; }
.prow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 6px; border-radius: 14px; background: var(--slab); box-shadow: inset 0 0 0 1.5px var(--edge); border: 0; width: 100%; color: inherit; text-align: left; }
.prow.turn { box-shadow: inset 0 0 0 2px var(--gold); }
.prow .med { font-size: 15px; }
.prow .nm { flex: 1; min-width: 0; }
.prow .nm b { display: block; font: 400 16px/1 var(--display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nm small { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.prow .st { display: flex; gap: 9px; font: 800 12px/1 var(--text); color: var(--ink3); align-items: center; }
.prow .st span { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.prow .pts { font: 400 24px/1 var(--display); color: var(--gold); min-width: 26px; text-align: right; }
.prow .pts small { font: 800 10px/1 var(--text); color: var(--muted); }
.bank { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 14px; border-radius: 14px; background: var(--pit); font: 800 11px/1 var(--text); letter-spacing: .14em; color: var(--muted); margin-top: 10px; }
.bank .rc { font-size: 10px; }
.logl { font: 400 13.5px/1.4 var(--text); color: var(--ink3); padding: 6px 2px; box-shadow: inset 0 -1px 0 #ffffff12; }
.logl.roll b { color: var(--gold); }
.logl.trade { color: #a8f0c0; } .logl.robber, .logl.seven { color: #ffb0b0; } .logl.crown, .logl.end { color: var(--gold); font-weight: 600; } .logl.auto, .logl.offer { color: var(--muted); }
.costs { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; }
.costs .pi { width: 34px; height: 34px; }
.costs .dv { font-size: 24px; width: 34px; text-align: center; }
.costs b { font: 400 16px/1.1 var(--display); letter-spacing: .02em; }
.costs b small { display: block; font: 400 12px/1.3 var(--text); color: var(--ink-p2); letter-spacing: 0; }
.costs .cs { display: flex; gap: 3px; font-size: 9.5px; }
.empty { text-align: center; color: var(--muted); font: 400 15px/1.4 var(--text); padding: 14px; }
.leave { text-align: center; margin-top: 18px; }

/* ---- chat */
.msgs { height: 38vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }
.msg { align-self: flex-start; max-width: 84%; padding: 10px 14px; background: var(--pit); font: 400 16px/1.3 var(--text); border-radius: 16px 16px 16px 4px; }
.msg.me { align-self: flex-end; background: var(--gold-bg); color: var(--gold-ink); border-radius: 16px 16px 4px 16px; }
.chatIn { display: flex; gap: 8px; margin-top: 10px; }
.chatIn input { flex: 1; min-width: 0; font: 400 16px/1.2 var(--text); padding: 12px; border: 0; border-radius: var(--r3); background: var(--pit); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--edge); outline: none; }
.crow { display: flex; align-items: center; gap: 10px; padding: 10px 8px; box-shadow: inset 0 -1px 0 #ffffff12; }
.crow .med { font-size: 14px; }
.crow .nm { flex: 1; min-width: 0; font: 400 16px/1.2 var(--display); letter-spacing: .03em; }
.crow .nm small { display: block; font: 400 13px/1.3 var(--text); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.crow .n { background: #ff4f5e; color: #fff; font: 700 11px/18px var(--text); min-width: 18px; text-align: center; border-radius: 999px; padding: 0 4px; }
.crow .go { color: var(--muted); font-size: 22px; }

/* ---- the trade dock: offers in front of you, pinned to the bottom of the screen */
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; display: none; }
#dock.on { display: block; }
#dock .in { max-width: 464px; margin: 0 auto; max-height: 62vh; overflow-y: auto; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
#dock .in > * { pointer-events: auto; flex: none; }
.dockbar { border: 0; align-self: center; padding: 11px 18px; border-radius: 999px; font: 800 11px/1 var(--text); letter-spacing: .16em; color: var(--ink-p); }
.dockbar.tuck { align-self: flex-end; padding: 8px 14px; font-size: 10px; opacity: .92; }
.offer { padding: 12px 12px 12px; border-radius: 18px; animation: slideUp .25s cubic-bezier(.3, 1.2, .5, 1); }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.offer .hd { display: flex; align-items: center; gap: 8px; font: 800 11px/1 var(--text); letter-spacing: .16em; color: var(--ink-p2); margin-bottom: 9px; }
.offer .hd .med { font-size: 11px; }
.offer .hd b { font: 400 16px/1 var(--display); letter-spacing: .03em; color: var(--ink-p); }
.offer .hd .x { margin-left: auto; border: 0; background: transparent; color: var(--ink-p2); font: 800 12px/1 var(--text); letter-spacing: .1em; padding: 6px 4px; text-decoration: underline; }
.offer .swap { display: flex; align-items: stretch; gap: 8px; }
.offer .side { flex: 1; min-width: 0; background: rgba(122, 90, 44, .12); border-radius: 12px; padding: 8px 10px 9px; }
.offer .side small { display: block; font: 800 10px/1 var(--text); letter-spacing: .18em; color: var(--ink-p2); margin-bottom: 8px; }
.offer .side .cs { display: flex; gap: 9px; flex-wrap: wrap; font-size: 12.5px; min-height: 40px; align-items: center; padding-top: 3px; }
.offer .arrow { align-self: center; font: 400 22px/1 var(--display); color: var(--wood); flex: none; }
.offer .hint { font: 600 12.5px/1.3 var(--text); color: #1f6b3a; margin: 8px 2px 0; }
.offer .hint.bad { color: #a3222c; }
.offer .btns { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 7px; margin-top: 10px; }
.offer .btns.two { grid-template-columns: 1.5fr 1fr; }
.offer .btns .btn { font-size: 15px; padding: 13px 4px; }
.offer .re { display: flex; align-items: center; gap: 8px; padding: 7px 0; box-shadow: inset 0 1px 0 rgba(122, 90, 44, .25); font: 600 13.5px/1.25 var(--text); }
.offer .re:first-of-type { margin-top: 10px; }
.offer .re .med { font-size: 11px; }
.offer .re .nm { font: 400 15px/1 var(--display); letter-spacing: .03em; min-width: 58px; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.offer .re .what { flex: 1; min-width: 0; color: var(--ink-p2); display: flex; align-items: center; flex-wrap: wrap; gap: 2px; }
.offer .re .what.yes { color: #1f6b3a; font-weight: 800; } .offer .re .what.no { color: #a3222c; }
.offer .re .btn { font-size: 13px; padding: 10px 11px; flex: none; }
.offer .re .no { border: 0; background: transparent; color: var(--ink-p2); font: 800 13px/1 var(--text); padding: 8px 6px; }
.offer.slim { padding: 9px 12px; display: flex; align-items: center; gap: 8px; font: 600 13px/1.25 var(--text); color: var(--ink-p2); }
.offer.slim .med { font-size: 11px; }
.offer.slim span.t { flex: 1; min-width: 0; }
.offer.slim button { border: 0; background: transparent; color: var(--ink-p2); font: 800 12px/1 var(--text); text-decoration: underline; padding: 6px 2px; }

/* ---- sheets: panels that slide up from the bottom */
#sheet { position: fixed; inset: 0; z-index: 40; display: none; }
#sheet.on { display: block; }
#sheet .back { position: absolute; inset: 0; background: rgba(3, 14, 28, .72); animation: dlgIn .18s ease-out; }
#sheet .panel2 { position: absolute; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: calc(var(--vh, 100vh) - 30px); overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); box-sizing: border-box; animation: sheetUp .26s cubic-bezier(.3, 1.1, .5, 1); }
@keyframes sheetUp { from { transform: translateY(60%); opacity: .4; } to { transform: none; opacity: 1; } }
.sh-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.sh-h h2 { font: 400 24px/1 var(--display); letter-spacing: .03em; margin: 0; text-transform: uppercase; }
.sh-h .x { border: 0; background: rgba(122, 90, 44, .15); color: var(--ink-p); width: 36px; height: 36px; border-radius: 50%; font: 800 16px/1 var(--text); }
.sh-p { font: 400 14.5px/1.45 var(--text); color: var(--ink-p2); margin: 0 0 12px; }
.sh-p b { color: var(--ink-p); }
.seg { display: flex; gap: 6px; margin-bottom: 14px; background: rgba(122, 90, 44, .13); padding: 4px; border-radius: 14px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 11px 0; border-radius: 11px; font: 800 12px/1 var(--text); letter-spacing: .14em; color: var(--ink-p2); }
.seg button.on { background: #fff; color: var(--ink-p); box-shadow: 0 2px 6px rgba(0, 0, 0, .15); }
.lab { display: flex; justify-content: space-between; align-items: baseline; font: 800 11px/1 var(--text); letter-spacing: .2em; color: var(--ink-p2); margin: 4px 2px 9px; }
.lab small { font: 600 12px/1 var(--text); letter-spacing: 0; }
.pickrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
.pk { position: relative; border: 0; background: rgba(122, 90, 44, .1); border-radius: 14px; padding: 12px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--ink-p2); }
.pk .rc { font-size: 17px; }
.pk small { font: 600 11px/1 var(--text); }
.pk.sel { background: #fff; box-shadow: inset 0 0 0 2.5px var(--wood); }
.pk.dis { opacity: .35; }
.pk .mn { position: absolute; left: -3px; top: -5px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--red-bg); color: #fff; font: 800 18px/24px var(--text); padding: 0; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); }
.pk .rate { font: 800 11px/1 var(--text); color: var(--ink-p); background: var(--parch3); border-radius: 999px; padding: 3px 7px; }
.towho { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
.towho::-webkit-scrollbar { display: none; }
.towho button { flex: none; display: flex; align-items: center; gap: 7px; border: 0; background: rgba(122, 90, 44, .12); border-radius: 999px; padding: 5px 13px 5px 5px; font: 400 15px/1 var(--display); letter-spacing: .03em; color: var(--ink-p); }
.towho button .med { font-size: 11px; }
.towho button.all { padding-left: 13px; height: 37px; }
.towho button.on { background: var(--ink-p); color: var(--parch); }
.sh-hint { font: 600 13.5px/1.35 var(--text); color: #1f6b3a; margin: -4px 2px 12px; min-height: 18px; }
.sh-hint.warn { color: #a3222c; }
.sh-go { width: 100%; font-size: 19px; padding: 17px; }
.brow { display: flex; align-items: center; gap: 12px; padding: 11px 0; box-shadow: inset 0 -1px 0 rgba(122, 90, 44, .22); }
.brow:last-of-type { box-shadow: none; }
.brow .pi { width: 44px; height: 44px; }
.brow .dv { font-size: 30px; width: 44px; text-align: center; flex: none; }
.brow .tx { flex: 1; min-width: 0; }
.brow .tx b { display: block; font: 400 18px/1 var(--display); letter-spacing: .02em; }
.brow .tx .cs { display: flex; gap: 4px; font-size: 10.5px; margin-top: 7px; align-items: center; }
.brow .tx .cs .rc.lack { box-shadow: 0 0 0 2px #c22a35; filter: saturate(.5); }
.brow .tx small { display: block; font: 600 12.5px/1.3 var(--text); color: var(--ink-p2); margin-top: 6px; }
.brow .tx small.bad { color: #a3222c; }
.brow .btn { flex: none; font-size: 15px; padding: 13px 14px; min-width: 76px; }
.devc { display: flex; gap: 12px; padding: 12px 0; box-shadow: inset 0 -1px 0 rgba(122, 90, 44, .22); align-items: center; }
.devc .ic { width: 46px; height: 60px; flex: none; border-radius: 9px; background: linear-gradient(160deg, #7a4fd0, #432489); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); position: relative; }
.devc .ic b { position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: #fff; color: var(--ink-p); font: 800 12px/20px var(--text); text-align: center; box-shadow: inset 0 0 0 1.5px var(--wood); }
.devc .tx { flex: 1; min-width: 0; }
.devc .tx b { display: block; font: 400 18px/1 var(--display); }
.devc .tx small { display: block; font: 400 12.5px/1.35 var(--text); color: var(--ink-p2); margin-top: 4px; }
.devc .tx small.why { font-weight: 800; color: #8a5a12; }
.devc .btn { flex: none; font-size: 15px; padding: 13px 14px; }
.victims { display: flex; flex-direction: column; gap: 8px; }
.victims button { display: flex; align-items: center; gap: 12px; border: 0; background: rgba(122, 90, 44, .12); border-radius: 16px; padding: 10px 14px 10px 10px; font: 400 20px/1 var(--display); color: var(--ink-p); text-align: left; }
.victims button .med { font-size: 17px; }
.victims button b { flex: 1; font-weight: 400; }
.victims button small { font: 800 13px/1 var(--text); color: var(--ink-p2); }
.help h4 { font: 400 17px/1 var(--display); margin: 16px 0 6px; letter-spacing: .02em; }
.help p, .help li { font: 400 14px/1.45 var(--text); color: var(--ink-p2); margin: 0 0 6px; }
.help ul { margin: 0; padding-left: 20px; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { font-size: 16px; padding: 15px; }
.hist { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 4px 0 2px; }
.hist div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; font: 800 10px/1 var(--text); color: var(--ink-p2); height: 100%; }
.hist i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: #b9a370; min-height: 2px; }
.hist .red i { background: #d9534f; } .hist .seven i { background: #2d2014; }

/* ---- the end */
.verdict { text-align: center; padding: 8px 0 4px; }
.verdict .big { font: 400 40px/1.05 var(--display); letter-spacing: .02em; margin: 6px 0 8px; }
.verdict.ok .big { color: #b37400; }
.standings > div { display: flex; align-items: center; gap: 10px; padding: 9px 2px; box-shadow: inset 0 -1px 0 rgba(122, 90, 44, .22); }
.standings .num { font: 400 16px/1 var(--display); width: 20px; flex: none; color: var(--ink-p2); }
.standings .med { font-size: 12px; }
.standings b { flex: 1; font: 400 17px/1 var(--display); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.standings b small { display: block; font: 600 11.5px/1.2 var(--text); color: var(--ink-p2); letter-spacing: 0; margin-top: 3px; }
.standings .sc { font: 400 24px/1 var(--display); }
.awards { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; }
.award { padding: 8px 12px; border-radius: 12px; background: var(--gold-bg); color: var(--gold-ink); font: 800 11px/1.2 var(--text); letter-spacing: .14em; }
.award small { display: block; font: 600 11.5px/1.2 var(--text); letter-spacing: 0; margin-top: 3px; }

/* ---- pops */
#toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%) translateY(-14px); z-index: 80; max-width: 92vw; padding: 11px 18px; border-radius: 16px; background: var(--paper); color: var(--ink-p); font: 600 14.5px/1.25 var(--text); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; box-shadow: 0 8px 24px rgba(0, 0, 0, .45), inset 0 0 0 2px var(--wood); text-align: center; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.out { opacity: 0; }
#pop { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; pointer-events: none; }
#pop.on { display: flex; animation: popIn .25s cubic-bezier(.3, 1.4, .5, 1); }
#pop.out { animation: popOut .25s ease-in forwards; }
#pop > div { position: relative; text-align: center; padding: 22px 30px; border-radius: 22px; background: var(--paper); box-shadow: inset 0 0 0 3px var(--wood), 0 20px 60px #000c; max-width: 84vw; }
#pop b { display: block; font: 400 40px/1 var(--display); letter-spacing: .03em; color: var(--ink-p); }
#pop span { display: block; font: 600 15px/1.3 var(--text); color: var(--ink-p2); margin-top: 8px; }
#pop.good b { color: #1f7a3f; } #pop.bad b { color: #b3202c; } #pop.gold b { color: #b37400; }
@keyframes popOut { from { opacity: 1; } to { opacity: 0; transform: scale(1.2); } }
#offline { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 85; display: none; padding: 10px 18px; border-radius: 999px; background: #a81c26; color: #fff; font: 800 12px/1 var(--text); letter-spacing: .1em; white-space: nowrap; }
#offline.on { display: block; }
.hitfx { animation: hitBg .5s ease-out; }
@keyframes hitBg { 0% { box-shadow: inset 0 0 0 100vmax #ff5a5a66; } 100% { box-shadow: inset 0 0 0 100vmax transparent; } }
.goldfx { animation: goldBg .8s ease-out; }
@keyframes goldBg { 0% { box-shadow: inset 0 0 0 100vmax #ffcc3366; } 100% { box-shadow: inset 0 0 0 100vmax transparent; } }
</style>
</head>
<body>

<section class="view on" id="join">
  <div class="wrap">
    <div class="logo"><div class="mk" data-logo></div><b data-title><span></span><small data-sub></small></b></div>
    <form id="joinForm" class="j-card paper" autocomplete="off">
      <label for="name"><span>YOUR NAME</span><span id="nameLeft" class="left">12</span></label>
      <input id="name" maxlength="12" placeholder="Your name" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <label for="code"><span>ROOM CODE</span></label>
      <input id="code" maxlength="4" placeholder="••••" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="btn j-play" id="playBtn">JOIN THE GAME</button>
      <div class="j-or">OR</div>
      <button class="btn paper j-host" id="hostBtn" type="button">START A NEW GAME</button>
      <p class="j-note">No TV needed: every phone shows the whole island. Starting a game gives you a code to share.</p>
      <p id="joinErr"></p>
      <p id="joinWait"></p>
    </form>
    <div id="saves"></div>
    <div id="deskTv">Got a TV or a laptop handy? <a href="/tv">Open the big-screen page</a> on it.</div>
    <p class="ver" id="ver"></p>
  </div>
</section>

<section class="view" id="lobby"><div class="wrap"></div></section>

<section class="view" id="play">
  <div id="hud"></div>
  <div id="boardWrap"><div id="board"></div><button id="helpBtn" data-a="sheet" data-v="help" aria-label="How to play">?</button><button id="zoomBtn" aria-label="Zoom">＋</button><div id="floaters"></div></div>
  <div id="prompt"></div>
  <div id="hand"></div>
  <div id="acts"></div>
  <div id="below"></div>
</section>

<div id="dock"><div class="in"></div></div>
<div id="sheet"></div>
<div id="pop"><div><b></b><span></span></div></div>
<div id="toast"></div>
<div id="offline">Reconnecting…</div>

<script src="/rules.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Game, R = window.Rules, $ = F.$, esc = F.esc, sfx = F.sfx;
  var sess = F.store.get('sof.me', null);
  var backup = F.store.get('sof.backup', null);
  var S = null, me = null, conn = null, hello = null, lastSeq = null, clockAt = 0;
  var triedRejoinByName = false, typed = false, triedRestore = false, downAt = 0;
  var waiting = false, waited = false, waitTimer = null, online = false, LIVE_MS = 15 * 60 * 1000;
  function freshUi() { return { tab: 'table', chatWith: null, mode: null, sel: null, sheet: null, trade: null, discard: null, glow: {}, dismissed: {}, showQr: false, plenty: [] }; }
  var ui = freshUi();
  var zoom = { s: 1, x: 0, y: 0 };

  function waitForGame() {
    waiting = true; waited = true;
    var bar = $('#offline'); bar.textContent = 'Hang tight. Bringing your game back…'; bar.classList.add('on');
    // If the server forgot the room, this phone can hand it back.
    if (!triedRestore && backup && sess && backup.code === sess.code && conn) {
      triedRestore = conn.send({ t: 'restore', phone: true, code: sess.code, token: sess.token, blob: backup.blob, idle: downAt && backup.got ? Math.max(0, downAt - backup.got) : 0 });
    }
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () { if (waiting && conn && hello) conn.send(hello); }, 2000);
  }
  function stopWaiting() { if (!waiting) return; waiting = false; clearTimeout(waitTimer); var bar = $('#offline'); bar.classList.remove('on'); bar.textContent = 'Reconnecting…'; }

  document.querySelectorAll('[data-title] > span').forEach(function (n) { n.textContent = F.TITLE; });
  document.querySelectorAll('[data-sub]').forEach(function (n) { n.textContent = F.SUB; });
  document.querySelectorAll('[data-logo]').forEach(function (n) { n.innerHTML = F.logo(); });
  document.title = 'Settlers of Friends';
  $('#ver').textContent = 'VERSION ' + F.VERSION;
  F.pressFx();

  var view = 'join';
  function show(id) {
    if (id === view) return;
    view = id;
    document.querySelectorAll('.view').forEach(function (n) { n.classList.toggle('on', n.id === id); });
    closeSheet(true);
    if (id !== 'play') $('#dock').classList.remove('on');
    window.scrollTo(0, 0);
  }
  var toastTimer, toastOut;
  function toast(html, ms, raw) {
    var t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastOut);
    if (raw) t.innerHTML = html; else t.textContent = html;
    t.classList.remove('out');
    if (t.classList.contains('on')) F.bump(t, 1.05); else t.classList.add('on');
    toastTimer = setTimeout(function () { t.classList.add('out'); toastOut = setTimeout(function () { t.classList.remove('on', 'out'); }, 200); }, ms || 3000);
  }
  var popTimer, popOut;
  function pop(kind, title, sub, ms) {
    var el = $('#pop');
    clearTimeout(popTimer); clearTimeout(popOut);
    el.className = ''; void el.offsetWidth;
    el.querySelector('b').textContent = title; el.querySelector('span').textContent = sub || '';
    el.className = 'on ' + kind;
    popTimer = setTimeout(function () { el.classList.add('out'); popOut = setTimeout(function () { el.className = ''; }, 260); }, ms || 1500);
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  function send(m) { if (!conn || !conn.send(m)) { toast('Reconnecting… try again in a second'); return false; } return true; }
  function player(id) { return S ? (S.players.filter(function (p) { return p.id === id; })[0] || null) : null; }
  function pname(id) { var p = player(id); return p ? p.name : '?'; }
  function med(id, cls) { return F.med(player(id), cls); }
  function colorOf(id) { return F.colorOf(player(id)); }
  function G() { return S.game; }
  function myTurn() { var g = G(); return !!(g && g.turn && g.turn.pid === me.id); }
  function inGame() { var g = G(); return !!(g && g.players[me.id] && me.res); }
  function names(ids) { ids = ids.map(pname); return ids.length > 1 ? ids.slice(0, -1).join(', ') + ' and ' + ids[ids.length - 1] : ids[0] || ''; }

  function fitViewport() { var vv = window.visualViewport; document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px'); }
  if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
  addEventListener('resize', fitViewport); fitViewport();

  /* ------------------------------------------------------------- join */
  var codeIn = $('#code'), nameIn = $('#name');
  var qCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  codeIn.value = qCode || '';
  nameIn.value = F.store.get('sof.name', '');
  function joinReady() {
    codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z]/g, '');
    $('#nameLeft').textContent = (12 - nameIn.value.length) + ' left';
    var ok = codeIn.value.length === 4 && nameIn.value.trim().length > 0;
    $('#playBtn').classList.toggle('ready', ok);
    return ok;
  }
  codeIn.addEventListener('input', joinReady); nameIn.addEventListener('input', joinReady); joinReady();
  function looks() { return { face: F.store.get('sof.face', null), color: F.store.get('sof.color', null), photo: F.store.get('sof.photo', null) }; }
  $('#joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    sfx.unlock();
    if (!joinReady()) { $('#joinErr').textContent = nameIn.value.trim() ? 'Enter the 4-letter room code, or start a new game.' : 'Enter your name first.'; F.shake($('#joinForm')); return; }
    $('#joinErr').textContent = '';
    typed = true;
    var nm = nameIn.value.trim().toUpperCase();
    F.store.set('sof.name', nm);
    joinBusy(true);
    if (sess && sess.token && sess.code === codeIn.value && sess.name === nm) { triedRejoinByName = false; start({ t: 'rejoin', code: sess.code, token: sess.token }); }
    else start(Object.assign({ t: 'join', code: codeIn.value, name: nm }, looks()));
  });
  $('#hostBtn').addEventListener('click', function () {
    sfx.unlock();
    var nm = nameIn.value.trim().toUpperCase();
    if (!nm) { $('#joinErr').textContent = 'Enter your name first.'; F.shake($('#joinForm')); nameIn.focus(); return; }
    $('#joinErr').textContent = ''; typed = true;
    F.store.set('sof.name', nm);
    sess = null; F.store.del('sof.me');
    joinBusy(true);
    start(Object.assign({ t: 'host', name: nm, settings: F.store.get('sof.settings', null) }, looks()));
  });
  var busyTimer;
  function joinBusy(on) {
    clearTimeout(busyTimer);
    $('#playBtn').classList.toggle('busy', on); $('#hostBtn').classList.toggle('busy', on);
    $('#joinWait').textContent = '';
    if (on) busyTimer = setTimeout(function () { $('#joinWait').textContent = 'Waking the game up. The first join of the night can take up to a minute.'; }, 3500);
  }
  function start(h) {
    hello = h; lastSeq = null;
    if (!conn) conn = F.connect({ hello: function () { return hello; }, onMessage: onMessage, onStatus: function (ok) { online = ok; if (ok) triedRestore = false; else if (!downAt) downAt = Date.now(); $('#offline').classList.toggle('on', !ok && !!S); } });
    else if (!conn.send(h)) { joinBusy(false); $('#joinErr').textContent = 'Connecting… try again in a moment.'; }
  }
  function backToJoin(msg) {
    stopWaiting();
    S = null; me = null; hello = null; sess = null; ui = freshUi();
    F.store.del('sof.me');
    joinBusy(false);
    show('join'); renderSaves();
    $('#joinErr').textContent = msg || '';
    if (msg) F.shake($('#joinForm'));
  }
  // Saved games kept on this phone.
  function saves() { var l = F.store.get('sof.saves', []); return Array.isArray(l) ? l : []; }
  function renderSaves() {
    var l = saves();
    $('#saves').innerHTML = l.map(function (s, i) {
      return '<div class="save"><div class="tx">Saved game: ' + esc((s.info.players || []).join(', ')) + '<small>Turn ' + (s.info.turns || 0) + ' · leader on ' + (s.info.lead || 0) + ' of ' + (s.info.target || 10) + ' · ' + F.ago(s.info.at) + '</small></div><button class="btn sm" data-a="loadSave" data-v="' + i + '">Resume</button><button class="chip" data-a="dropSave" data-v="' + i + '">✕</button></div>';
    }).join('');
  }
  renderSaves();

  function onMessage(m) {
    if (m.t === 'joined') {
      joinBusy(false); stopWaiting(); waited = false; downAt = 0;
      sess = { code: m.code, token: m.token, name: (sess && sess.name) || nameIn.value.trim().toUpperCase(), at: Date.now() };
      F.store.set('sof.me', sess);
      hello = { t: 'rejoin', code: m.code, token: m.token };
      triedRejoinByName = false;
      F.stayAwake();
    } else if (m.t === 'backup') {
      backup = { code: m.code, blob: m.blob, got: Date.now() };
      F.store.set('sof.backup', backup);
    } else if (m.t === 'restoreDone') {
      if (hello) conn.send(hello);
    } else if (m.t === 'saved') {
      var l = saves().filter(function (s) { return (s.info.players || []).join() !== (m.info.players || []).join(); });
      l.unshift({ blob: m.blob, info: m.info });
      if (!F.store.set('sof.saves', l.slice(0, 4))) toast('This phone is out of room to save games.');
      else F.dialog({ title: 'Game saved', text: 'It’s saved on this phone. To pick it up another night, open the game here and tap Resume on the start screen. Everyone joins the new code with the same names.', buttons: [{ label: 'Keep playing', kind: 'ghost', value: false }, { label: 'OK', kind: 'pri', value: true }] });
    } else if (m.t === 'loaded') {
      var nm = (nameIn.value.trim() || F.store.get('sof.name', '')).toUpperCase();
      sess = null; F.store.del('sof.me');
      codeIn.value = m.code; joinReady();
      start({ t: 'join', code: m.code, name: nm });
    } else if (m.t === 'error') {
      var ours = sess && hello && (hello.t === 'rejoin' || (hello.t === 'join' && String(hello.code).toUpperCase() === sess.code));
      if (m.code === 'noroom' && m.wait && ours && (S || Date.now() - (sess.at || 0) < LIVE_MS)) waitForGame();
      else if (m.code === 'noroom' && hello && hello.t === 'rejoin' && sess && sess.name && !triedRejoinByName) { triedRejoinByName = true; hello = { t: 'join', code: sess.code, name: sess.name }; conn.send(hello); }
      else if (!S || m.code === 'noroom') {
        if (waited && sess && m.code === 'noroom') {
          var keep = sess;
          backToJoin('Your game hasn’t come back yet. Tap JOIN THE GAME in a moment to jump back in.');
          sess = keep; F.store.set('sof.me', keep);
          codeIn.value = keep.code; if (keep.name) nameIn.value = keep.name; joinReady(); waited = false;
        } else backToJoin(typed || S ? m.msg : '');
      } else { toast(m.msg, 3400); buzz(60); sfx.nope(); }
    } else if (m.t === 'left') {
      if (conn && m.replaced) { conn.stop(); conn = null; }
      backToJoin(m.kicked ? 'You were removed from the game.' : m.replaced ? 'This game was opened on another device or tab.' : '');
    } else if (m.t === 'state') {
      joinBusy(false);
      if (sess && Date.now() - (sess.at || 0) > 20000) { sess.at = Date.now(); F.store.set('sof.me', sess); }
      var list = m.s.fx || [], fresh = [];
      if (lastSeq === null) lastSeq = list.length ? list[list.length - 1].seq : 0;
      else { fresh = list.filter(function (e) { return e.seq > lastSeq; }); if (fresh.length) lastSeq = fresh[fresh.length - 1].seq; }
      S = m.s; me = S.me; clockAt = Date.now(); window.__S = S; window.__ui = ui;
      render(fresh);
    }
  }

      case 'dice': { var st3 = Object.assign({}, S.settings); st3.dice = st3.dice === 'balanced' ? 'random' : 'balanced'; F.store.set('sof.settings', st3); send({ t: 'h', a: 'settings', settings: st3 }); sfx.tap(); break; }
      case 'h': send({ t: 'h', a: v }); sfx.tap(); if (ui.sheet && ui.sheet.kind === 'menu') closeSheet(); break;
      case 'leave': F.confirm(g && S.phase !== 'gameOver' ? 'Leave the game?' : 'Leave?', g && S.phase !== 'gameOver' ? 'A bot takes over your seat. Join again with the same name to take it back.' : 'You can join again any time.', 'Leave', true).then(function (ok) { if (ok) send({ t: 'leave' }); }); break;
      /* play */
      case 'tab': ui.tab = v; if (v !== 'chat') ui.chatWith = null; renderBelow(); break;
      case 'roll': send({ t: 'roll' }); buzz(40); break;
      case 'end': {
        var mineOffer = g.trades.some(function (x) { return x.from === me.id; });
        if (mineOffer && S.phase === 'main') F.confirm('End your turn?', 'Your offer on the table will be withdrawn.', 'End turn').then(function (ok) { if (ok) send({ t: 'end' }); });
        else send({ t: 'end' });
        ui.mode = null; ui.sel = null;
        break;
      }
      case 'confirm': confirmSel(); break;
      case 'cancelMode': ui.mode = null; ui.sel = null; renderPlay(); break;
      case 'roadsDone': send({ t: 'roadsDone' }); break;
      case 'quick': quick(v); break;
      case 'sheet':
        if (v === 'discard') ui.discard = ui.discard || R.empty();
        if (v === 'dev' && !inGame()) break;
        openSheet(v);
        break;
      case 'closeSheet': closeSheet(); break;
      case 'who': if (v !== me.id && inGame() && tradeOpen() && (g.trading === 'open' || myTurn() || g.turn.pid === v)) { ui.trade = newTrade(v); openSheet('trade'); } else if (v !== me.id && player(v) && !player(v).bot) { ui.tab = 'chat'; ui.chatWith = v; renderBelow(); } break;
      case 'openTrade': {
        // Reopening keeps what was last put together, trimmed to the cards still in hand.
        var prev = ui.trade, nt = newTrade();
        if (prev && prev.lock === nt.lock) { nt.tab = prev.tab; nt.to = nt.lock || (prev.to && g.players[prev.to] ? prev.to : null); R.RES.forEach(function (r) { nt.give[r] = Math.min(prev.give[r], me.res[r]); nt.want[r] = prev.want[r]; }); }
        ui.trade = nt; openSheet('trade');
        break;
      }
      case 'editOffer': { var mo = g.trades.filter(function (x) { return x.from === me.id; })[0]; if (!mo) break; ui.trade = newTrade(mo.to); ui.trade.give = Object.assign(R.empty(), mo.give); ui.trade.want = Object.assign(R.empty(), mo.want); openSheet('trade'); break; }
      case 'cancelOffer': send({ t: 'cancelOffer', id: Number(v) }); break;
      case 'deal': { var mo2 = g.trades.filter(function (x) { return x.from === me.id; })[0]; if (mo2) send({ t: 'deal', id: mo2.id, with: v }); break; }
      case 'noCounter': { var mo3 = g.trades.filter(function (x) { return x.from === me.id; })[0]; if (mo3) send({ t: 'declineCounter', id: mo3.id, pid: v }); break; }
      case 'answer': send({ t: 'answer', id: Number(b.getAttribute('data-id')), s: v }); sfx.tap(); break;
      case 'reopen': send({ t: 'answer', id: Number(v), s: 'reopen' }); break;
      case 'dockMin': ui.dockMin = !ui.dockMin; renderDock(); break;
      case 'dismiss': ui.dismissed[v] = true; renderDock(); break;
      case 'counter': {
        var src = g.trades.filter(function (x) { return x.id === Number(v); })[0];
        if (!src) break;
        ui.trade = newTrade(src.from);
        // Start from their deal, seen from this side: what they want is what I'd give.
        R.RES.forEach(function (r) { ui.trade.give[r] = Math.min(src.want[r] || 0, me.res[r]); ui.trade.want[r] = src.ask ? 0 : (src.give[r] || 0); });
        openSheet('counter', { id: src.id });
        break;
      }
      case 'ttab': t.tab = v; renderSheet(); break;
      case 'tTo': t.to = v || null; renderSheet(); break;
      case 'tAdd': {
        var side = b.getAttribute('data-side');
        if (side === 'give') { if (t.want[v]) { toast('You can’t give and get the same thing.'); break; } if (t.give[v] >= me.res[v]) { if (!me.res[v]) toast('You have no ' + R.RES_NAME[v].toLowerCase() + '.'); break; } t.give[v]++; }
        else { if (t.give[v]) { toast('You can’t give and get the same thing.'); break; } if (t.want[v] < 9) t.want[v]++; }
        sfx.pick(); renderSheet();
        break;
      }
      case 'tSub': e.stopPropagation(); t[b.getAttribute('data-side')][v] = Math.max(0, t[b.getAttribute('data-side')][v] - 1); sfx.pick(); renderSheet(); break;
      case 'tGo': sendOffer(); break;
      case 'bGive': t.bGive = v; if (t.bGet === v) t.bGet = null; t.bN = 1; sfx.pick(); renderSheet(); break;
      case 'bGet': t.bGet = v; sfx.pick(); renderSheet(); break;
      case 'bN': t.bN = Math.max(1, t.bN + Number(v)); renderSheet(); break;
      case 'bankGo': if (send({ t: 'bank', give: t.bGive, get: t.bGet, n: t.bN })) { t.bGive = null; t.bGet = null; t.bN = 1; } break;
      case 'playDev':
        if (v === 'plenty' || v === 'mono') { ui.plenty = []; openSheet(v); }
        else { send({ t: 'dev', k: v }); closeSheet(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        break;
      case 'pickRes': {
        var plenty = ui.sheet.kind === 'plenty';
        if (!plenty) ui.plenty = [v];
        else if (ui.plenty.length < 2 && g.bank[v] > ui.plenty.filter(function (x) { return x === v; }).length) ui.plenty.push(v);
        sfx.pick(); renderSheet();
        break;
      }
      case 'unpickRes': e.stopPropagation(); { var ix = ui.plenty.indexOf(v); if (ix >= 0) ui.plenty.splice(ix, 1); } renderSheet(); break;
      case 'pickGo': if (ui.sheet.kind === 'plenty') send({ t: 'dev', k: 'plenty', a: ui.plenty[0], b: ui.plenty[1] }); else send({ t: 'dev', k: 'mono', a: ui.plenty[0] }); ui.plenty = []; closeSheet(); break;
      case 'disc': if (ui.discard[v] < me.res[v] && R.total(ui.discard) < g.discard[me.id]) { ui.discard[v]++; sfx.pick(); renderSheet(); } break;
      case 'undisc': e.stopPropagation(); ui.discard[v] = Math.max(0, ui.discard[v] - 1); renderSheet(); break;
      case 'discGo': if (send({ t: 'discard', cards: ui.discard })) ui.discard = null; break;
      case 'steal': send({ t: 'steal', pid: v }); break;
      case 'sound': sfx.mute(!sfx.isMuted()); F.store.set('sof.mute', sfx.isMuted()); renderSheet(); break;
      case 'invite': closeSheet(); F.dialog({ title: 'Room ' + S.code, html: '<img src="/qr.svg?u=' + encodeURIComponent(joinUrl()) + '" alt="" style="width:200px;height:200px;display:block;margin:0 auto 14px;background:#fff;padding:8px;border-radius:12px"><p>Scan to join, or go to ' + esc(location.host) + ' and enter the code. Someone who dropped out gets their seat back by joining with the same name. For a big screen, open ' + esc(location.host) + '/tv.</p>', buttons: [{ label: 'Share the link', kind: 'pri', value: 'share' }, { label: 'Close', kind: 'ghost', value: false }] }).then(function (r) { if (r === 'share') share(); }); break;
      case 'endGame': closeSheet(); F.confirm('End the game now?', 'Whoever has the most points right now wins.', 'End the game', true).then(function (ok) { if (ok) send({ t: 'h', a: 'endGame' }); }); break;
      case 'chatWith': ui.chatWith = b.getAttribute('data-id'); renderBelow(); break;
      case 'chatBack': ui.chatWith = null; renderBelow(); break;
      case 'chatSend': chatGo(); break;
    }
  });
  if (F.store.get('sof.mute', false)) sfx.mute(true);
  function chatGo() {
    var inp = $('#chatIn'); if (!inp || !ui.chatWith) return;
    var text = inp.value.trim(); if (!text) return;
    send({ t: 'chat', to: ui.chatWith, text: text });
    inp.value = ''; inp.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'chatIn') { e.preventDefault(); chatGo(); } });
  // The photo picker lives outside the redrawn screens so it survives every update.
  var photoIn = document.createElement('input');
  photoIn.type = 'file'; photoIn.accept = 'image/*'; photoIn.style.display = 'none';
  document.body.appendChild(photoIn);
  photoIn.addEventListener('change', function () {
    var f = photoIn.files && photoIn.files[0]; if (!f) return;
    toast('Getting your photo ready…');
    F.shrinkPhoto(f).then(function (data) { send({ t: 'photo', data: data }); F.store.set('sof.photo', data); }).catch(function () { toast('That photo didn’t work. Try another one.'); });
  });
})();
</script>
